name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Pull requests share a group per ref so new pushes cancel stale runs.
# Pushes to master get a unique group so every commit keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  compat:
    name: Compat (TSLint ${{ matrix.tslint }}, TypeScript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tslint: ['5', '6']
        typescript: ['2.4', '3.9', '4.9', '5', '6']
        include:
          # The declared peer floor for TSLint.
          - tslint: '5.1.0'
            typescript: '2.4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Compile with the devDependency TypeScript before overriding it:
      # the rule ships as compiled JS, so only the runtime versions vary.
      - run: npm run build
      - run: npm i --no-save tslint@${{ matrix.tslint }} typescript@${{ matrix.typescript }}
      - name: Assert installed versions
        env:
          WANT_TS: ${{ matrix.typescript }}
          WANT_TSLINT: ${{ matrix.tslint }}
        run: |
          node -e '
            const ts = require("typescript/package.json").version;
            const tslint = require("tslint/package.json").version;
            console.log(`typescript ${ts}, tslint ${tslint}`);
            const wantTs = process.env.WANT_TS;
            const wantTslint = process.env.WANT_TSLINT;
            if (ts !== wantTs && !ts.startsWith(wantTs + ".")) {
              console.error(`Expected typescript ${wantTs}.x, got ${ts}`);
              process.exit(1);
            }
            if (tslint !== wantTslint && !tslint.startsWith(wantTslint + ".")) {
              console.error(`Expected tslint ${wantTslint}.x, got ${tslint}`);
              process.exit(1);
            }
          '
      # Older TSLint versions silently run zero fixtures when given a path they
      # don't understand and still exit 0, so require every fixture to report.
      - name: Run tests
        run: |
          set -o pipefail
          npm run test:only | tee test.out
          want=$(ls test/automated/*/*.lint | wc -l)
          got=$(grep -cE '\.ts\.lint:.* Passed' test.out || true)
          echo "Passed fixtures: $got of $want"
          if [ "$got" -ne "$want" ]; then
            echo "::error::Expected $want passing lint fixtures, got $got"
            exit 1
          fi
